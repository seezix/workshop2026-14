# Sentinel-X : broker du docker-compose.yml.
# En clair et sans authentification : acceptable sur un réseau local de démo
# seulement. La cible (GUIDELINES §9) est TLS sur 8883 avec une ACL par client.
listener 1883
allow_anonymous true

# Les messages retained (config et status des boîtiers) survivent à un redémarrage.
persistence true
persistence_location /mosquitto/data/
