# Sentinel-X : broker du docker-compose.yml.
# TLS uniquement sur 8883 (GUIDELINES §9) : aucun listener en clair.
# Certificats dans infra/mosquitto/certs/ (voir le README de ce dossier) :
# server.crt et server.key pour le broker, ca.crt pour les clients.
# Reste sans authentification : la cible est un compte par client avec une ACL.
listener 8883
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
allow_anonymous true

# Les messages retained (config et status des boîtiers) survivent à un redémarrage.
persistence true
persistence_location /mosquitto/data/
