# Réglages du suivi (ByteTrack) pour Sentinel-X
# track_buffer : nombre d'images pendant lesquelles une personne "perdue" garde son numéro.
# 90 images ≈ 3 secondes (au lieu de 1 s par défaut) -> moins de "nouvelles apparitions"
tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90
match_thresh: 0.8
fuse_score: True
